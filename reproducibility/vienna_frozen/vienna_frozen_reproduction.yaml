# Offline public reproduction of the accepted frozen Vienna case.
# Run verify_inputs.py before execution. Live acquisition is intentionally
# unavailable: the workflow must accept the checksum-verified external cache.
project:
  run_name: vienna_frozen_public_v0_3_2_reproduction
  output_dir: 04_outputs/_reproducibility/vienna_frozen_public_v0_3_2
  overwrite_existing_run: false

aoi:
  mode: file
  name: vienna_center_larger_frozen
  path: reproducibility/vienna_frozen/inputs/processed/aoi_metric.gpkg
  layer: aoi

crs_strategy:
  processing_mode: single_crs
  context_buffer_m: 100

# This deliberately unsupported source type makes missing or incompatible
# frozen inputs fail locally instead of falling back to a network request.
data_source:
  type: frozen_overture_input
  release: 2026-05-20.0
  provider: aws
  exclude_underground: true

preprocessing:
  target_crs: EPSG:32633
  clean_geometries: true
  clip_to_aoi: true

aggregation:
  method: regular_grid
  cell_size_m: 100
  clip_to_aoi: true
  grid_id_convention: row_col_0_based_south_to_north_v1

indicators:
  gsi: true
  far_fsi: true
  built_volume_density: true
  neighbor_distance: true
  height_to_distance_ratio: false

indicator_parameters:
  min_distance_for_ratio_m: 0.5
  boundary_distance_threshold_m: 50.0
  high_ratio_threshold: 10.0

height_enrichment:
  enabled: true
  source: gba_lod1_parquet
  mode: fill_missing_only
  replace_existing_height: false
  min_overlap_share: 0.2
  min_valid_height_m: 2.0
  bbox_buffer_deg: 0.002
  max_download_size_mb: 2000
  save_enriched_buildings: true
  save_gba_subset: false
  save_matches: false

street_context:
  enabled: true
  source: osmnx
  network_type: drive
  distance_m: 10
  tick_length_m: 60
  topology_rule_version: 1
  use_existing_if_available: true
  save_streets: true
  save_street_profiles: true
  save_building_street_assignment: true

outputs:
  mode: research
  save_raw_buildings: false
  save_processed_buildings: true
  save_grid: true
  save_indicator_grid: true
  save_neighbor_diagnostics: true
  save_tables: true
  save_reports: true
  save_gsi_sanity_diagnostics: true

visualization:
  save_static_maps: false
  figure_dpi: 300
  figure_format: png

cache:
  enabled: true
  source_output_dir: reproducibility/vienna_frozen/inputs
  use_existing_raw_buildings: false
  use_existing_cleaned_buildings: false
  use_existing_enriched_buildings: true
  use_existing_neighbor_context: false
  use_existing_street_context: false
  use_existing_street_network: true
  use_existing_street_profiles: false
  force_refresh: false
  require_compatible_manifest: true
